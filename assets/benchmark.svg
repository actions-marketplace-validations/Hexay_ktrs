    .s { fill: #656d76; font-size: 12px; }
    .ours { fill: #7f52ff; }
    .jvm { fill: #b4b9c0; }
    .axis { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .t, .h { fill: #e6edf3; }
