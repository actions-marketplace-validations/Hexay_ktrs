<svg xmlns="http://www.w3.org/2000/svg" width="720" height="282" viewBox="0 0 720 282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="okhttp, 617 files. Format: ktrs 0.07 s, ktfmt GraalVM native image 1.13 s, ktfmt jar 1.74 s. Lint: ktrs 0.12 s, ktlint jar 4.41 s.">
  <style>
