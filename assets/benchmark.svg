  <rect class="ours" x="120" y="38" width="8" height="22" rx="2"/>
  <text class="t" x="136" y="54" font-weight="600">0.07 s</text>
  <text class="t" x="110" y="85" text-anchor="end">ktfmt GraalVM</text>
  <rect class="jvm" x="120" y="70" width="127" height="22" rx="2"/>
  <text class="t" x="255" y="86">1.13 s</text>
  <text class="t" x="110" y="117" text-anchor="end">ktfmt jar</text>
